<!--
  ./backend/emails/template/passwordReset.js
-->

<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation de mot de passe</title>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
  <table align="left" border="0" cellpadding="0" cellspacing="0" width="100%" style="padding: 20px 0;">
    <tr>
      <td align="left">
        <table border="0" cellpadding="0" cellspacing="0" width="400" style="background-color: #ffffff; border: 1px solid #ddd; border-radius: 10px;">
          <tr>
            <td style="padding: 20px;">
              <h2 style="color: #333; font-size: 24px; margin: 0;">Hey {{firstName}},</h2>
              <p style="font-size: 16px; color: #333;">Nous avons reçu une demande de réinitialisation de votre mot de passe. Cliquez sur le bouton ci-dessous pour le réinitialiser :</p>

              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 20px 0;">
                <tr>
                  <td align="center">
                    <a href="{{resetLink}}" style="display: inline-block; padding: 10px 20px; background-color: #007BFF; color: #ffffff; text-decoration: none; border-radius: 5px;">Réinitialiser mon Mot de Passe</a>
                  </td>
                </tr>
              </table>

              <p style="font-size: 16px; color: #333; margin-top: 30px;">Cordialement,<br><strong>L'équipe AtlProCraft</strong></p>

              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 20px; padding-top: 10px; border-top: 1px solid #ddd;">
                <tr>
                  <td align="left" style="font-size: 12px; color: #777;">
                    <p>Si vous n'avez pas demandé ce code, veuillez ignorer cet e-mail.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
